# Hält die Rebrickable-Daten (data/) aktuell.
# Manuell starten: GitHub → Actions → „Teiledaten aktualisieren“ → Run workflow.
name: Teiledaten aktualisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'tools/update-data.sh'
  schedule:
    - cron: '17 3 1 * *'   # monatlich am 1. um 03:17 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSV-Dateien laden
        run: bash tools/update-data.sh
      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          # version.json ändert sich immer – nur committen, wenn sich echte Daten geändert haben
          if git diff --cached --quiet -- data/*.csv.gz && git ls-files --error-unmatch data/parts.csv.gz >/dev/null 2>&1; then
            echo "Keine Datenänderung."
            exit 0
          fi
          git commit -m "Teiledaten aktualisieren"
          git push
